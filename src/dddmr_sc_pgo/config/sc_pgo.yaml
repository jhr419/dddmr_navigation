# =============================================================================
# SC-PGO 配置文件
# 
# 该文件配置基于 ScanContext 的回环检测和 GTSAM 位姿图优化参数
# 根据你的硬件和环境调整这些参数
# =============================================================================

/**:
    ros__parameters:
        # =====================================================================
        # ScanContext 参数 - 用于基于点云的全局位置识别
        # =====================================================================
        
        # 最大检测半径（米）- 根据环境大小调整
        # 室内场景：建议 20-50 米
        # 室外场景：建议 80-150 米
        sc_max_radius: 20.0
        
        # 极坐标网格的环数（径向分区数）
        # 更多的环可以捕捉更细粒度的结构
        # 建议值：10-30
        sc_num_rings: 20
        
        # 极坐标网格的扇区数（角度分区数）
        # 更多的扇区可以更好地区分不同方向
        # 建议值：30-90
        sc_num_sectors: 60
        
        # KD-Tree 搜索的最大深度
        # 影响搜索效率和内存使用
        sc_tree_depth: 20
        
        # 回环检测阈值（相关系数）
        # 阈值越低，检测越宽松，召回率越高
        # 建议值：0.55-0.70（放宽以提高召回率，配合严格的ICP过滤）
        sc_loop_threshold: 0.60
        
        # =====================================================================
        # 关键帧参数 - 控制何时保存新的关键帧
        # =====================================================================
        
        # 关键帧距离阈值（米）
        # 当机器人移动超过此距离时创建新关键帧
        # 值越小，关键帧越密集，精度越高，但计算量越大
        keyframe_distance: 1.5
        
        # 关键帧角度阈值（度）
        # 当机器人旋转超过此角度时创建新关键帧
        keyframe_angle: 500.0
        
        # =====================================================================
        # 回环检测参数
        # =====================================================================
        
        # 回环检测的最小时间/帧间隔
        # 避免检测到最近访问过的位置
        # 建议值：25-50
        loop_min_interval: 30
        
        # 回环检测平移阈值（米）
        # 用于验证回环候选的有效性
        loop_trans_threshold: 1.0

        # 楼层检测高度阈值（米）
        # 如果两个关键帧的 z 坐标差异超过此值，认为是不同楼层
        # 拒绝不同楼层的回环以避免错误约束
        # 建议值：3.5 - 5.0（根据楼层高度调整）
        floor_height_threshold: 4.0
        
        # 回环检测旋转阈值（度）
        # 用于验证回环候选的有效性
        loop_rot_threshold: 30.0
        
        # =====================================================================
        # ICP 参数 - 用于精确对齐回环中的两个扫描
        # =====================================================================
        
        # ICP 最大对应点距离
        # 用于初步过滤不合理的回环候选
        icp_max_corr_distance: 3.0

        # ICP 最大匹配误差阈值（新参数）
        # 只有 ICP 误差小于此值的回环才会被接受
        icp_max_error: 1.0

        # ICP 最大迭代次数
        icp_max_iterations: 100
        
        # =====================================================================
        # 噪声模型参数 - GTSAM 优化中使用
        # =====================================================================
        
        # 里程计平移噪声标准差（米）
        # 表示连续关键帧之间位置估计的不确定性
        odom_trans_noise: 0.1
        
        # 里程计旋转噪声标准差（弧度）
        # 表示连续关键帧之间角度估计的不确定性
        odom_rot_noise: 0.05
        
        # 回环噪声标准差（收紧以提高置信度）
        # 值越小表示越信任回环约束，几何闭合更紧
        loop_noise: 0.35
        
        # =====================================================================
        # 发布参数
        # =====================================================================
        
        # 路径发布间隔（秒）
        path_publish_interval: 0.5
        
        # =====================================================================
        # 坐标框架配置
        # =====================================================================
        
        # 世界坐标系（地图坐标系）
        # Fast-LIO 使用 camera_init 作为世界坐标系
        world_frame: "camera_init"
        
        # 机器人坐标系
        # Fast-LIO 使用 body 作为机器人坐标系
        body_frame: "body"

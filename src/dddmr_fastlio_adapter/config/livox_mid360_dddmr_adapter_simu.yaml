fastlio_dddmr_adapter:
  ros__parameters:
    odom_topic: "/Odometry"
    body_cloud_topic: "/cloud_registered_body"
    map_cloud_topic: "/Laser_map"

    map_frame: "map"
    base_frame: "base_link"
    child_frame: "base_link"
    publish_tf: true
    publish_period_s: 1.0
    odom_history_duration_s: 2.0
    max_odom_stamp_diff_s: 0.05

    mapping_dir: "/home/dddmr_bags/dddmr_fastlio_sim_mid360_map"
    save_on_shutdown: false

    # In simulation /imu/data is the robot body IMU, so Fast-LIO body equals base_link.
    base_to_body_xyz: [0.0, 0.0, 0.0]
    base_to_body_rpy: [0.0, 0.0, 0.0]

    keyframe_distance: 0.5
    keyframe_angle: 0.5
    keyframe_min_points: 100
    keyframe_cloud_leaf_size: 0.15
    global_map_leaf_size: 0.25

    min_range: 0.5
    max_range: 60.0

    ground_z_min: -0.45
    ground_z_max: 0.20
    ground_abs_slope_max: 0.35
    feature_min_z: -0.20
    keep_ground_in_features: false

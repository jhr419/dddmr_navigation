/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "/tmp/fastlio_mid360_map.pcd"

    common:
      lid_topic: "/mid360"
      imu_topic: "/imu/data"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1
      scan_line: 4
      blind: 0.5
      timestamp_unit: 3
      scan_rate: 10

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_en: false
      # Simulation publishes /imu/data in the robot body frame, while the
      # Mid360 cloud is mounted at base_link -> livox_frame.
      extrinsic_T: [0.1, 0.0, 0.11]
      extrinsic_R: [0.8843969318, 0.0, 0.4667355429,
                    0.0, 1.0, 0.0,
                    -0.4667355429, 0.0, 0.8843969318]

    publish:
      path_en: true
      effect_map_en: false
      map_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: true
      pcd_save_enable: 1
      interval: -1
